<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAECO · Đánh giá Workpack</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23003b71' d='M4 42Q25 8 60 14 37 24 22 51z'/%3E%3Cpath fill='%23d5a62e' d='M19 45Q35 20 56 18 39 29 29 52z'/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/app.css"></head>
<body>
<aside><div class="brand"><div class="lotus">✦</div><div><b>VIETNAM AIRLINES</b><span>VAECO · Engineering</span></div></div><nav>
<button class="active" data-view="dashboard">⌂ <span>Tổng quan</span></button><button data-view="tallies">▤ <span>Tally Sheet</span></button><button data-view="evaluation">✓ <span>Đánh giá WP</span></button><button data-view="database">▦ <span>Dữ liệu AMOS</span></button></nav><div class="aside-foot"><span class="dot"></span> MiniDB sẵn sàng</div></aside>
<main><header><div><h1 id="pageTitle">Tổng quan đánh giá Workpack</h1><p id="pageSub">Theo dõi dữ liệu, tiến độ review và kết quả đánh giá</p></div><div class="header-actions"><button class="ghost" id="refreshBtn">Làm mới</button><button class="primary" id="openUpload">＋ Nạp Tally Sheet</button><div class="avatar">VA</div></div></header>
<section id="dashboardView" class="view"></section><section id="evaluationView" class="view hidden"></section><section id="databaseView" class="view hidden"></section>
</main>
<dialog id="uploadDialog"><form id="uploadForm"><div class="dialog-head"><div><h2>Nạp Tally Sheet</h2><p>Hỗ trợ mẫu VietJet và Lufthansa</p></div><button type="button" class="icon" data-close>×</button></div><label class="drop"><input name="file" type="file" accept=".xlsx" required><strong>Chọn file Excel hoặc kéo thả vào đây</strong><span>Tối đa 30 MB · định dạng .xlsx</span></label><div class="grid2"><label>Khách hàng<select name="customer"><option value="VA-VJ">VietJet (VA-VJ)</option><option value="DLH">Lufthansa (DLH)</option></select></label><label>Số đăng ký<input name="aircraft_reg" placeholder="VJC-A699"></label><label>Loại tàu bay<input name="aircraft_type" placeholder="A320"></label><label>Check Type<input name="check_type" placeholder="24MT / H-CHECK"></label></div><div class="dialog-actions"><button type="button" class="ghost" data-close>Hủy</button><button class="primary" type="submit">Nạp và đánh giá</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm"><div class="dialog-head"><div><h2>Review task</h2><p id="editTask"></p></div><button type="button" class="icon" data-close>×</button></div><label>MHR review<input name="reviewed_mhr" type="number" min="0" step="0.01"></label><label class="check"><input name="important_job" type="checkbox"> Đánh dấu Important Job</label><label>Ghi chú<textarea name="review_note" rows="3"></textarea></label><label>Lý do thay đổi <span class="required">*</span><textarea name="reason" rows="2" required></textarea></label><div class="dialog-actions"><button type="button" class="ghost" data-close>Hủy</button><button class="primary" type="submit">Lưu thay đổi</button></div></form></dialog>
<dialog id="dataDialog"><div class="data-detail"><div class="dialog-head"><div><h2 id="dataDetailTitle">Chi tiết dữ liệu</h2><p id="dataDetailSub"></p></div><button type="button" class="icon" data-close>×</button></div><div id="dataDetailBody"></div><div class="dialog-actions"><button type="button" class="primary" data-close>Đóng</button></div></div></dialog>
<div id="toast"></div><script src="/static/app.js"></script></body></html>
